seed: 1337
task: all
metrics:
  - mse
  - psnr
  - ssim
  - gmsd
nrow: 6
output_dir: output
job_name: jct_test6
excluding_modules: null

# tracker
report_to: wandb          # 可选 "wandb" / "tensorboard" / "all"
wandb_project: ddpm_ct
wandb_entity: justinji_2545-shenzhen-university        # 你的 team 名，个人账号可留 null
# wandb_run_name: jct_test5        # 运行名，与 job_name 一致即可，方便在 wandb 上查看

#model
model: unet
optimizer: adamw
lr: 4.0e-5
weight_decay: 0.01
criterion: in

lr_scheduler: constant_with_warmup
num_warmup_steps: 6000 # 10 000

#train
resume: null
freeze_modules: null
use_ema: false
mixed_precision: bf16
gradient_accumulation_steps: 1 # 1
prediction_type: sample
max_train_steps: 100000 # 100 000
save_step_freq: 200 # 200

#evaluate 
evaluate: false
validation_start_steps: 6000 # 10 000
validation_steps: 200 # 200
compare: max
monitor: psnr
visual: false     # 训练中可视化

# sample
sample_steps: 50 # 50 default
sample_method: heun

#dataset
base_data_dir: /data/jzk/CT/data_522
dataset_name: ct3d
resolution:
 - 512
 - 512
 - 8
train_batch_size: 1
test_batch_size: 1
num_workers: 16
# 限制的是baser中数据进入模型的范围，以及最终计算metric的数据范围
data_range: m11 # option: 0.0,1.0 or -1.0,1.0 

model_config:
  image_size = 512,
  in_channels = 1,
  model_channels = 64,
  out_channels = 1,
  num_res_blocks = 2,
  attention_resolutions = [],
  dropout = 0.1,
  channel_mult = [1, 2, 2, 4, 8],
  conv_resample = True,
  dims = 3,
  num_classes = None,
  use_checkpoint = False,
  use_fp16 = False,
  num_heads = 1,
  num_head_channels = -1,
  num_heads_upsample = -1,
  use_scale_shift_norm = False,
  resblock_updown = False,
  use_new_attention_order = False,
  num_groups = 32,
  bottleneck_attention = True,
  additive_skips = True,