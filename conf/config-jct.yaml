seed: 1337
task: recon
metrics:
  - mse
  - psnr
nrow: 6
output_dir: output
job_name: jct_vpred_justin1
excluding_modules: null

#model
model: jct
optimizer: adamw
lr: 4.0e-5
weight_decay: 0.01
ctiterion: in

lr_scheduler: constant_with_warmup
num_warmup_steps: 10000 # 10 000

#train
resume: null
freeze_modules: null
use_ema: false
mixed_precision: bf16
gradient_accumulation_steps: 1
prediction_type: sample
max_train_steps: 100000 # 100 000
save_step_freq: 2000 # 200

#evaluate 
evaluate: false
validation_start_steps: 10000
validation_steps: 200 # 200
compare: max
monitor: psnr
visual: false     # 训练中可视化

#dataset
base_data_dir: /data/jzk/CT/data_522
dataset_name: ct3d
resolution:
 - 512
 - 512
 - 8
train_batch_size: 1
test_batch_size: 1
num_workers: 16


